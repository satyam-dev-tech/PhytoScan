<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#081C15" />
      <stop offset="50%" stop-color="#1B4332" />
      <stop offset="100%" stop-color="#2D6A4F" />
    </linearGradient>
    <linearGradient id="leafGrad" x1="16" y1="48" x2="48" y2="16" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#52B788" />
      <stop offset="100%" stop-color="#D8F3DC" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Squircle -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bgGrad)" stroke="#74C69D" stroke-width="1.5" stroke-opacity="0.4" />

  <!-- Optical Reticle Corners -->
  <path d="M14 22 V15 H21" stroke="#52B788" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.75" />
  <path d="M50 22 V15 H43" stroke="#52B788" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.75" />
  <path d="M14 42 V49 H21" stroke="#52B788" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.75" />
  <path d="M50 42 V49 H43" stroke="#52B788" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.75" />

  <!-- Central Sprout Emblem -->
  <!-- Stem -->
  <path d="M32 46 C32 38 32 30 32 26" stroke="url(#leafGrad)" stroke-width="3" stroke-linecap="round" />
  <!-- Left Leaf -->
  <path d="M32 35 C24 35 20 28 22 21 C29 20 32 27 32 35 Z" fill="url(#leafGrad)" />
  <!-- Right Leaf -->
  <path d="M32 30 C40 30 44 23 42 16 C35 15 32 22 32 30 Z" fill="url(#leafGrad)" />

  <!-- AI Telemetry Status Dot -->
  <circle cx="48" cy="16" r="3.5" fill="#74C69D" filter="url(#glow)" />
  <circle cx="48" cy="16" r="1.5" fill="#FFFFFF" />
</svg>
